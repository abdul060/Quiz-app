<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Quiz App</title>
    <link rel="stylesheet" href="/css/Signup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header>
      <div class="logocontainer">
        <div class="logofirstbackground">
          <div class="logosecondbackground">
            <span class="LogoSignature" aria-hidden="true">+</span>
          </div>
        </div>
      </div>
      <div class="YourNameContainer">
        <h1>Create account</h1>
      </div>
      <div class="usernameContainer">
        <p>Sign up and start playing</p>
      </div>
    </header>
    <form
      class="statsContainer"
      id="SignupForm"
      aria-label="Sign up"
      novalidate>
      <div class="InputsContainer">
        <div class="UsernameInputcontainer">
          <div class="iconBackground">
            <img src="/assets/person-icon-hd.png" alt="" />
          </div>
          <input
            type="text"
            placeholder="Username"
            id="SignupUsernameInput"
            aria-label="Username" />
        </div>
        <p class="invalidcontent" id="UsernameError" role="alert"></p>
        <div class="PasswordInputcontainer">
          <div class="iconBackground2">
            <img src="/assets/lock-icon-hd.png" alt="" />
          </div>
          <input
            type="email"
            placeholder="Email"
            id="SignupEmailInput"
            aria-label="Email" />
        </div>
        <p class="invalidcontent" id="EmailError" role="alert"></p>
      </div>
      <div class="InputsContainer">
        <div class="UsernameInputcontainer">
          <div class="iconBackground">
            <img src="/assets/person-icon-hd.png" alt="" />
          </div>
          <input
            type="password"
            placeholder="Password"
            id="SignupPasswordInput"
            aria-label="Password" />
        </div>
        <p class="invalidcontent" id="PasswordError" role="alert"></p>
        <div class="PasswordInputcontainer">
          <div class="iconBackground2">
            <img src="/assets/lock-icon-hd.png" alt="" />
          </div>
          <input
            type="password"
            placeholder="Confirm password"
            id="SignupConfirmInput"
            aria-label="Confirm password" />
        </div>
        <p class="invalidcontent" id="ConfirmError" role="alert"></p>
      </div>
      <div class="SubContainer">
        <div class="RememberContainer">
          <input type="checkbox" id="TermsChecker" />
          <label for="TermsChecker">I agree to the terms</label>
        </div>
      </div>
      <button type="submit">Sign up</button>
    </form>
    <p class="AccountPrompt">
      Already have an account? <a href="index.html"><span>Log in</span></a>
    </p>

    <!-- // this code for footer dont tocuh /Abdul // -->
    <footer class="footer">
      <nav class="footer_nav">
        <ul class="footer_list">
          <li>
            <a href="home.html">
              <img
                src="/assets/footer-home-icon.png"
                alt=""
                width="36"
                height="36" />
              <span class="footer_span">Home</span>
            </a>
          </li>

          <li>
            <a href="scoreboard.html">
              <img
                src="/assets/footer-leaderboard-icon.png"
                alt=""
                width="36"
                height="36" />
              <span class="footer_span">Scoreboard</span>
            </a>
          </li>

          <li>
            <a href="profile.html">
              <img
                src="/assets/footer-profile-icon.png"
                alt=""
                width="36"
                height="36" />
              <span class="footer_span">Profile</span>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
    <!-- // this code for footer dont tocuh /Abdul // -->

    <script type="module" src="../js/account/signup.js"></script>
  </body>
</html>
