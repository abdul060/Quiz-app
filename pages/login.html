<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <header>
        <div class="logocontainer">
            <div class="logofirstbackground">
                <div class="logosecondbackground">
                    <span class="LogoSignature" aria-hidden="true">?</span>
                </div>
            </div>
        </div>
        <div class="YourNameContainer">
            <h1>Welcome back!</h1>
        </div>
        <div class="usernameContainer">
            <p>Log in to keep playing!</p>
        </div>
    </header>
     <div class="statsContainer" role="group" aria-label="Your statistics">
            <div class="InputsContainer">
                <div class="UsernameInputcontainer">
                    <div class="iconBackground"><img src="/assets/person-icon-hd.png" alt=""></div>
                    <input type="text" placeholder="Username or Email">
                </div>
                <div class="PasswordInputcontainer">
                    <div class="iconBackground2"><img src="/assets/lock-icon-hd.png" alt=""></div>
                    <input type="text" placeholder="Password">
                </div>
            </div>
            <div class="SubContainer">
                <div class="RememberContainer">
                    <input type="checkbox"> <p>Remember me</p>
                </div>
                <p>Forgot password?</p>
            </div>
            <button>Log in</button>
        </div>
        <h3>Don`t have an account? <span>Sign up</span></h3>
</body>
</html>
