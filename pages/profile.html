<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/profile.css">
    <title>Profile</title>
</head>
<body>
    <div class="header">
        <div class="logocontainer">
            <div class="logofirstbackground">
                <div class="logosecondbackground">
                    <h1 class="LogoSignature">E</h1>
                </div>
            </div>
        </div>
        <div class="YourNameContainer">
            <h2>[Your name]</h2>
        </div>
        <div class="usernameContainer">
            <h3>@username <span></span> Level 3</h3>
        </div>
        <div class="statsContainer">
            <div class="statsChildren">
                <h3>12</h3>
                <p>Games played</p>
            </div>
            <div class="statsChildren">
                <h3 id="correctanswerStat">48</h3>
                <p>Correct answers</p>
            </div>
            <div class="statsChildren">
                <h3 id="leaderboardStat">#5</h3>
                <p>Leaderboard</p>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="TitleContainer">
        <h1>Settings</h1>
        </div>
        <div class="subseciton">
            <div class="leftSideContent">
                <div class="iconBackground"></div>
                <h3>Edit profile</h3>
            </div>
        </div>
        <div class="dividerLine"></div>
        <div class="subseciton">
            <div class="leftSideContent">
                <div class="iconBackground2"><span>N</span></div>
                <h3>Notifications</h3>
            </div>
            <div class="rightSideContent">
                <button id="buttonBackground">
                    <span></span>
                </button>
            </div>
        </div>
        <div class="dividerLine"></div>
        <div class="subseciton">
            <div class="leftSideContent">
                <div class="iconBackground2"><span>S</span></div>
                <h3>Sound effects</h3>
            </div>
            <div class="rightSideContent">
                <button id="buttonBackground2">
                    <span></span>
                </button>
            </div>
        </div>
        <div class="dividerLine"></div>
        <button id="LogOut">Log out</button>
    </div>
    
</body>
</html>
