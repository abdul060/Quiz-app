<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <title>Leaderboard - Quiz App</title>

<body>
    <main class="leaderboard">

        <header class="leaderboard_header">
            <h1 class="leaderboard_title">Leaderboard</h1>
            <p class="leaderboard_subtitle">Top players this week</p>
        </header>

        <nav class="tabs" aria-label="Scores">
            <a href="scoreboard.html" class="tabs_btn">My scores</a>
            <a href="leaderboard.html" class="tabs_btn tabs_btn-active" aria-current="page">Leaderboard</a>
        </nav>

        <div class="leaderboard_content">
            <section class="podium" aria-labelledby="podium-title">
                <h2 id="podium-title" class="visually-hidden">Top 3 players</h2>
                <ol class="podium_list">
                </ol>
            </section>

            <section aria-labelledby="players-title">
                <h2 id="players-title" class="visually-hidden">Other players</h2>
                <ol class="player_list" start="4">
                </ol>
            </section>
        </div>
    </main>
